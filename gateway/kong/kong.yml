_format_version: "3.0"

# Kong is the only public entry point (http://localhost:8000).
#
# Routing rules:
#   - Multi-service flows (sagas)  -> orchestrator-service
#   - Everything else              -> the service that owns the data
#   - Nothing under /internal/* is routed, so service-to-service endpoints
#     can never be reached from outside.
#   - user-service has no public route: only other services call it.
#
# Every route uses `strip_path: false`, so each service receives the full
# path (e.g. /events/123, not /123).
#
# Routes for services that aren't built yet are harmless: Kong starts fine
# and just returns an error for those paths until the service exists.

# Lets the Vue app (a different origin in development) call the API.
# Add the production frontend URL to `origins` when it exists.
plugins:
  - name: cors
    config:
      origins: ["http://localhost:5173"] # Vite dev server
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      headers: ["Authorization", "Content-Type"]
      max_age: 3600

services:
  # ── auth-service: login, sessions, tech support admin API ─────────────
  - name: auth-service
    url: http://auth-service:3000
    routes:
      - name: auth-login
        paths: ["/auth/login"]
        methods: ["POST", "OPTIONS"] # OPTIONS = browser CORS preflight
        strip_path: false
        plugins:
          # Slows down password guessing from one client, on top of
          # Keycloak's per-account lockout. Over the limit → 429.
          - name: rate-limiting
            config:
              minute: 10
              policy: local
      - name: auth-session
        paths: ["/auth/logout", "/auth/me"]
        methods: ["GET", "POST", "OPTIONS"]
        strip_path: false
      # auth-service checks the permission on every admin route; Kong just forwards.
      - name: auth-admin
        paths: ["/admin"]
        methods: ["GET", "POST", "PUT", "PATCH", "OPTIONS"]
        strip_path: false

  # ── orchestrator-service: multi-service flows ─────────────────────────
  # These paths sit inside the event/booking services' paths
  # (e.g. /events/123/confirm is under /events). They still reach the
  # orchestrator because each route here matches on path AND method, and
  # Kong prefers the route that matches more attributes. Keep `methods` on
  # these routes.
  - name: orchestrator-service
    url: http://orchestrator-service:3000
    routes:
      - name: decide-event-request
        paths: ["~/event-requests/[^/]+/decision$"]
        methods: ["POST", "OPTIONS"]
        strip_path: false
      - name: decide-venue-booking
        paths: ["~/venue-bookings/[^/]+/decision$"]
        methods: ["POST", "OPTIONS"]
        strip_path: false
      - name: confirm-event
        paths: ["~/events/[^/]+/confirm$"]
        methods: ["POST", "OPTIONS"]
        strip_path: false

  # ── Domain services (no `methods` = all methods, incl. OPTIONS) ───────
  - name: event-service
    url: http://event-service:3000
    routes:
      - name: event-routes
        paths: ["/event-requests", "/events"]
        strip_path: false

  - name: venue-service
    url: http://venue-service:3000
    routes:
      - name: venue-routes
        paths: ["/venues"]
        strip_path: false

  - name: booking-service
    url: http://booking-service:3000
    routes:
      - name: booking-routes
        paths: ["/venue-bookings"]
        strip_path: false

  - name: attendance-service
    url: http://attendance-service:3000
    routes:
      - name: attendance-routes
        paths: ["/attendances"]
        strip_path: false

  - name: messaging-service
    url: http://messaging-service:3000
    routes:
      - name: messaging-routes
        paths: ["/message-threads"]
        strip_path: false

  - name: notification-service
    url: http://notification-service:3000
    routes:
      - name: notification-routes
        paths: ["/notifications"]
        strip_path: false
