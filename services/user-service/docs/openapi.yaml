openapi: 3.0.3
info:
  title: ConnectSphere user-service (internal API)
  version: 0.1.0
  description: |
    User profiles and roles (user_db). **Internal only**: called by other
    services (today: auth-service), never by the browser. Kong does not route
    to user-service, and every route needs the `x-internal-api-key` header.

    These routes do not check permissions themselves — the calling service
    must (auth-service checks `users.view` / `users.manage` before calling).
    `passwordHash` is never returned.

    Frontend developers: use the BFF contract in services/auth-service/swagger.html
    (/api/admin/users) instead.
servers:
  - url: http://user-service:3000
    description: Inside the Docker network (how services call it)
  - url: http://localhost:3001
    description: From your machine (local debugging)

security:
  - internalApiKey: []

components:
  securitySchemes:
    internalApiKey:
      type: apiKey
      in: header
      name: x-internal-api-key
      description: Shared secret between services (INTERNAL_API_KEY in infra/docker-compose.yml).
  schemas:
    Role:
      type: string
      enum: [EVENT_ORGANISER, EVENT_COORDINATOR, VENUE_STAFF, TECHNICAL_SUPPORT_STAFF, ATTENDEE]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        company: { type: string, nullable: true }
        isActive: { type: boolean, description: false = disabled by tech support }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    Forbidden:
      description: Missing or wrong x-internal-api-key
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: User not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /internal/users:
    get:
      summary: List users, 25 per page
      parameters:
        - { name: search, in: query, schema: { type: string }, description: "Matches email, first or last name (case-insensitive)" }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' }, description: Ignored if not a valid role }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: A page of users, sorted by last then first name
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: '#/components/schemas/User' } }
                  page: { type: integer }
                  pageSize: { type: integer, enum: [25] }
                  total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a profile
      description: The caller (auth-service) has already validated input and created the Keycloak login. Email is stored lower-case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, role]
              properties:
                email: { type: string, format: email }
                firstName: { type: string }
                lastName: { type: string }
                role: { $ref: '#/components/schemas/Role' }
                company: { type: string, nullable: true }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already used
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /internal/users/by-email:
    get:
      summary: Find a user by email (used at login)
      parameters:
        - { name: email, in: query, required: true, schema: { type: string, format: email }, description: Trimmed and matched lower-case }
      responses:
        '200': { description: The user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get a user by id (used on every authenticated request)
      responses:
        '200': { description: The user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Change role and/or enable/disable
      description: Send at least one field. Disabling here does not end sessions or block Keycloak — auth-service does that; always go through PATCH /admin/users/{id}/status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      summary: Health check (no key needed)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [ok] } } } } } }
