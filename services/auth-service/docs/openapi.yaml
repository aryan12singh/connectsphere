openapi: 3.0.3
info:
  title: ConnectSphere auth-service
  version: 0.5.0
  description: |
    Organiser/Attendee sign-up, login, logout, "who am I", and the tech support admin API.

    - Passwords are checked by Keycloak; this service issues its own session tokens.
    - Send the token on every request as `Authorization: Bearer <token>`.
    - Access requires the permission and its fixed action-role boundary; multi-role grants form a union.
      By default only TECHNICAL_SUPPORT_STAFF has the admin permissions.
servers:
  # First = default in Swagger UI. /docs is served by auth-service on 3002,
  # so "Try it out" must call 3002 (calling Kong on 8000 from this page is
  # blocked by the browser as cross-origin).
  - url: http://localhost:3002
    description: Direct to auth-service (use this from Swagger UI)
  - url: http://localhost:8000
    description: Through Kong (how the Nuxt server calls it)

tags:
  - name: Auth
  - name: Admin - users
  - name: Admin - permissions
  - name: Admin - settings
  - name: Admin - audit
  - name: Internal
    description: Service-to-service only. Not routed by Kong; needs the x-internal-api-key header.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    internalApiKey:
      type: apiKey
      in: header
      name: x-internal-api-key
      description: Shared secret between services (INTERNAL_API_KEY). Only services inside the Docker network know it.
  schemas:
    Role:
      type: string
      enum: [EVENT_ORGANISER, EVENT_COORDINATOR, VENUE_STAFF, TECHNICAL_SUPPORT_STAFF, ATTENDEE]
    PublicRole:
      type: string
      enum: [EVENT_ORGANISER, ATTENDEE]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' }, description: Authoritative role list }
        organisationId: { type: string, nullable: true }
        company: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    Permissions:
      type: array
      items: { type: string }
      example: [events.view, attendance.register]
    Settings:
      type: object
      properties:
        sessionTtlHours: { type: integer, minimum: 1, maximum: 720, description: Applies to logins made after the change }
        idleTimeoutMinutes: { type: integer, minimum: 0, maximum: 1440, description: 0 = off. Applies to all sessions immediately }
        lockoutMaxFailures: { type: integer, minimum: 1, maximum: 20 }
        lockoutWaitMinutes: { type: integer, minimum: 1, maximum: 60 }
        lockoutMaxWaitMinutes: { type: integer, minimum: 1, maximum: 1440, description: Must be at least lockoutWaitMinutes }
        passwordMinLength: { type: integer, minimum: 8, maximum: 128 }
        passwordRequireUppercase: { type: boolean }
        passwordRequireLowercase: { type: boolean }
        passwordRequireDigit: { type: boolean }
        passwordRequireSpecial: { type: boolean }
    Error:
      type: object
      properties:
        error:
          oneOf:
            - { type: string }
            - type: object
              properties:
                code: { type: string }
                message: { type: string }
                fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
        details: { type: array, items: { type: string }, description: Only on invalid settings }
  responses:
    Unauthorised:
      description: Not logged in or session has expired
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Logged in, but the role lacks the permission this route needs
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: Keycloak or user-service unreachable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254, example: hafiz.ismail@connectsphere.sg }
                password: { type: string, maxLength: 128, example: Hafiz@CS11! }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: Session token. Shown only once — store it. }
                  expiresAt: { type: string, format: date-time }
                  user: { $ref: '#/components/schemas/User' }
                  permissions: { $ref: '#/components/schemas/Permissions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password, account locked, or account disabled (same message for all)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { description: Too many login attempts from this client (Kong rate limit) }
        '503': { $ref: '#/components/responses/Unavailable' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Organiser or Attendee self sign-up (no login needed)
      description: |
        Creates EVENT_ORGANISER (company required) or ATTENDEE (default when role omitted).
        Internal roles are seed-only; staff/unknown role requests return400 with field guidance.
        Organisation membership is resolved server-side by exact trimmed company name.
        Duplicate email returns409 with error.fields.email. No session is created;
        call /auth/login afterwards. Kong limits this route to 5 calls/minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, password]
              properties:
                role: { type: string, enum: [EVENT_ORGANISER, ATTENDEE], default: ATTENDEE }
                email: { type: string, format: email, maxLength: 254, example: new.attendee@example.com }
                firstName: { type: string, maxLength: 100, example: New }
                lastName: { type: string, maxLength: 100, example: Attendee }
                company: { type: string, maxLength: 200, nullable: true }
                password: { type: string, maxLength: 128, example: Str0ng!Pass, description: Must meet GET /auth/password-policy }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      firstName: { type: string }
                      lastName: { type: string }
                      role: { $ref: '#/components/schemas/PublicRole' }
                      roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
                      organisationId: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already used, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Too many sign-up attempts from this client (Kong rate limit) }
        '503': { $ref: '#/components/responses/Unavailable' }

  /auth/password-policy:
    get:
      tags: [Auth]
      summary: Current password rules (public, for the sign-up form)
      description: Set by tech support in PUT /admin/settings. Keycloak enforces the same rules.
      responses:
        '200':
          description: The rules a new password must meet
          content:
            application/json:
              schema:
                type: object
                properties:
                  minLength: { type: integer, example: 8 }
                  requireUppercase: { type: boolean }
                  requireLowercase: { type: boolean }
                  requireDigit: { type: boolean }
                  requireSpecial: { type: boolean }
                  notEmail: { type: boolean, enum: [true], description: Always on }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (ends this session)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Who is logged in, and what they may do
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The current user, their permissions, and when the session ends
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  permissions: { $ref: '#/components/schemas/Permissions' }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /admin/users:
    get:
      tags: [Admin - users]
      summary: List users (25 per page). Needs users.view
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string }, description: "Matches email, first or last name" }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: '#/components/schemas/User' } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin - users]
      summary: Create a user (Keycloak login + profile). Needs users.manage
      description: Creates only public roles. Organiser company is required; staff roles are seed-only. Password must meet current rules.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, role, password]
              properties:
                email: { type: string, format: email, example: new.staff@connectsphere.sg }
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/PublicRole' }
                company: { type: string, maxLength: 200, nullable: true }
                password: { type: string, maxLength: 128, example: LongerPass1! }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Email already used, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }

  /admin/users/{id}/role:
    patch:
      tags: [Admin - users]
      summary: Change a user's role. Needs users.manage
      description: Only eligible public-role accounts may change between public roles. Staff grants are seed-only; an Organiser needs an existing organisation link. You cannot change your own role.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/PublicRole' } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/status:
    patch:
      tags: [Admin - users]
      summary: Disable or re-enable an account. Needs users.manage
      description: Disabling blocks login and ends all of the user's open sessions. You cannot disable yourself.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [isActive], properties: { isActive: { type: boolean } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /admin/permissions:
    get:
      tags: [Admin - permissions]
      summary: All permissions, each role's permissions, and protected ones. Needs permissions.manage
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Permission matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: { type: object, properties: { key: { type: string }, description: { type: string } } }
                  roles:
                    type: object
                    additionalProperties: { $ref: '#/components/schemas/Permissions' }
                  protected:
                    type: object
                    description: Permissions that can never be removed from that role
                    additionalProperties: { $ref: '#/components/schemas/Permissions' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/roles/{role}/permissions:
    put:
      tags: [Admin - permissions]
      summary: Replace a role's permissions. Needs permissions.manage
      description: Protected permissions are always kept even if left out.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: role, in: path, required: true, schema: { $ref: '#/components/schemas/Role' } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [permissions], properties: { permissions: { $ref: '#/components/schemas/Permissions' } } }
      responses:
        '200':
          description: The role's permissions after saving
          content:
            application/json:
              schema: { type: object, properties: { role: { type: string }, permissions: { $ref: '#/components/schemas/Permissions' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/settings:
    get:
      tags: [Admin - settings]
      summary: Current login and password settings. Needs settings.manage
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin - settings]
      summary: Change some settings. Needs settings.manage
      description: Send only the fields to change. Lockout and password rules are copied to Keycloak; if that fails, nothing is saved.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
            example: { sessionTtlHours: 12, idleTimeoutMinutes: 30 }
      responses:
        '200': { description: Settings after saving, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /admin/audit-logs:
    get:
      tags: [Admin - audit]
      summary: Admin actions and attendee sign-ups (USER_REGISTERED), newest first (50 per page). Needs audit.view
      security: [{ bearerAuth: [] }]
      parameters: [{ name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }]
      responses:
        '200':
          description: A page of audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        actorId: { type: string }
                        action: { type: string, example: USER_ROLE_CHANGED }
                        targetId: { type: string, nullable: true }
                        details: { type: object, nullable: true }
                        createdAt: { type: string, format: date-time }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/sessions/validate:
    post:
      tags: [Internal]
      summary: Check a caller's session token (for other services' RBAC)
      description: |
        How another service (e.g. event-service) checks who is calling: forward the
        caller's Bearer token here, then check `permissions` for the permission
        your route needs. Same validity rules as /auth/me (expired, idle,
        revoked and disabled all fail).
      security: [{ internalApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The caller's session token (without "Bearer ") }
      responses:
        '200':
          description: Valid session
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, enum: [true] }
                  user: { $ref: '#/components/schemas/User' }
                  permissions: { $ref: '#/components/schemas/Permissions' }
                  expiresAt: { type: string, format: date-time }
        '401':
          description: Missing, invalid, expired, idle, revoked or disabled
          content:
            application/json:
              schema: { type: object, properties: { valid: { type: boolean, enum: [false] } } }
        '403':
          description: Missing/wrong private key, or a session user without recognised roles
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
