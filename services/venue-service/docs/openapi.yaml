openapi: 3.0.3
info:
  title: ConnectSphere venue-service
  version: 0.1.0
  description: |
    Venue catalogue, operating hours, blocks and availability (venue_db).
    **Sprint 2 contract.** Shared rules (errors, ids, times, identity headers) are in
    `docs/api-contract.md`.

    ### Who may do what
    | Action | Who |
    |---|---|
    | read venues, blocks, availability | any signed-in user with an interface role (Organiser, Coordinator, Venue Staff) |
    | create a venue | Venue Staff or Technical Support (a Venue Staff creator is assigned to it) |
    | edit a venue, add / remove blocks | Venue Staff **assigned to that venue**, or Technical Support |
    | deactivate a venue (`DELETE`) | Technical Support, or assigned Venue Staff |

    ### Availability is computed, not stored
    A slot is available when it lies **inside the operating hours** (in the venue's
    `timeZone`) and **overlaps no block**. From Sprint 3 it must also overlap no approved
    booking (booking-service). So adding a block can never leave a stale "available" row.

    ### Times
    Blocks and availability use ISO 8601 **with an offset**. Operating hours are wall-clock
    `"HH:MM"` in the venue's time zone.
servers:
  - url: http://localhost:8000
    description: Through Kong (use this)
  - url: http://localhost:3004
    description: Direct, local debugging only (no gateway)

security:
  - bearerAuth: []

paths:
  /venues:
    get:
      tags: [Venues]
      operationId: listVenues
      summary: Search the venue catalogue
      description: |
        Active venues only unless `includeInactive=true` (staff / Technical Support only).
        Array filters mean **has all of**: `facilities=wifi&facilities=stage` returns venues with both.
      parameters:
        - { name: q, in: query, description: Matches name or address (case-insensitive), schema: { type: string } }
        - { name: minCapacity, in: query, schema: { type: integer, minimum: 1 } }
        - { name: layout, in: query, description: Venue must offer this layout; with `minCapacity` the capacity of that layout is used, schema: { $ref: '#/components/schemas/LayoutType' } }
        - { name: facilities, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: accessibility, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of venues
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Venue' } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Venues]
      operationId: createVenue
      summary: Create a venue
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueInput' }
            example:
              name: Orchard Boardroom Suite
              address: 260 Orchard Road, Singapore 238855
              capacity: 24
              timeZone: Asia/Singapore
              facilities: [wifi, video_conferencing]
              accessibilityTags: [step_free_access, lift]
              layouts: [{ type: BOARDROOM, capacity: 24 }]
              operatingHours:
                - { dayOfWeek: 1, opensAt: '08:30', closesAt: '18:00' }
                - { dayOfWeek: 6, closed: true }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Venue' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /venues/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Venues]
      operationId: getVenue
      summary: One venue with layouts, hours and (for staff) managers
      responses:
        '200':
          description: The venue
          content: { application/json: { schema: { $ref: '#/components/schemas/Venue' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Venues]
      operationId: updateVenue
      summary: Replace a venue's details
      description: |
        Full replacement of the fields, including `layouts` and `operatingHours` (the lists
        sent become the new lists). `capacity` must be >= the largest layout capacity.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VenueInput' } } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Venue' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Venues]
      operationId: deactivateVenue
      summary: Deactivate a venue (soft delete)
      description: |
        Sets `isActive=false`; history and past bookings stay intact. Returns 409 if the
        venue still has approved future bookings (checked once booking-service exists, Sprint 3).
      responses:
        '204': { description: Deactivated }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /venues/{id}/blocks:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Blocks]
      operationId: listBlocks
      summary: Blocks overlapping a period
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Blocks, earliest first
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: '#/components/schemas/VenueBlock' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Blocks]
      operationId: createBlock
      summary: Block the venue for a period
      description: |
        Half-open interval `[startsAt, endsAt)`; `endsAt` must be after `startsAt` (422).
        A block overlapping an existing block at this venue is rejected with 409 `OVERLAP`
        (back-to-back blocks are fine).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueBlockInput' }
            example: { startsAt: '2026-10-19T07:00:00+08:00', endsAt: '2026-10-22T07:00:00+08:00', reason: MAINTENANCE, note: Main hall floor resurfacing }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/VenueBlock' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /venues/{id}/blocks/{blockId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: blockId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Blocks]
      operationId: deleteBlock
      summary: Remove a block
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /venues/{id}/availability:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Availability]
      operationId: getAvailability
      summary: Free windows for a period
      description: |
        Returns the windows when the venue is open and not blocked, between `from` and `to`
        (at most 62 days, else 422). Windows are split at day boundaries of the venue's time
        zone and are returned as instants. `blocks` lists what removed time, so the UI can explain why.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Availability
          content: { application/json: { schema: { $ref: '#/components/schemas/Availability' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; a retry with the same key and body replays the first response.
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: No session, expired, revoked, or account disabled
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Signed in but not allowed (e.g. not staff of this venue). Nothing changed.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: No such id
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Overlapping block, or the venue still has future bookings
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: OVERLAP, message: This period overlaps an existing block. } }
    Validation:
      description: Fails validation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { type: object, properties: { field: { type: string }, message: { type: string } } }
    LayoutType:
      type: string
      enum: [THEATRE, CLASSROOM, BANQUET, BOARDROOM, U_SHAPE, CABARET, STANDING]
    BlockReason:
      type: string
      enum: [MAINTENANCE, PRIVATE_USE, PUBLIC_HOLIDAY, OTHER]
    Layout:
      type: object
      required: [type, capacity]
      properties:
        type: { $ref: '#/components/schemas/LayoutType' }
        capacity: { type: integer, minimum: 1 }
    OperatingDay:
      type: object
      required: [dayOfWeek]
      description: ISO weekday, 1 = Monday ... 7 = Sunday. A day that is absent counts as closed.
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        closed: { type: boolean, default: false }
        opensAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '08:30' }
        closesAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '18:00', description: Must be after opensAt }
    VenueInput:
      type: object
      required: [name, address, capacity]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 300 }
        description: { type: string, nullable: true, maxLength: 2000 }
        capacity: { type: integer, minimum: 1 }
        timeZone: { type: string, default: Asia/Singapore, description: IANA name }
        facilities:
          type: array
          items: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
          description: 'lower_snake_case, e.g. wifi, projector, stage, catering_kitchen, parking'
        accessibilityTags:
          type: array
          items: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
          description: 'e.g. step_free_access, wheelchair_toilet, hearing_loop, lift, accessible_parking'
        layouts: { type: array, items: { $ref: '#/components/schemas/Layout' } }
        operatingHours: { type: array, items: { $ref: '#/components/schemas/OperatingDay' } }
    Venue:
      allOf:
        - $ref: '#/components/schemas/VenueInput'
        - type: object
          required: [id, isActive]
          properties:
            id: { type: string, format: uuid }
            isActive: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    VenueBlockInput:
      type: object
      required: [startsAt, endsAt, reason]
      properties:
        startsAt: { type: string, format: date-time, description: 'ISO 8601 WITH offset' }
        endsAt: { type: string, format: date-time }
        reason: { $ref: '#/components/schemas/BlockReason' }
        note: { type: string, nullable: true, maxLength: 500 }
    VenueBlock:
      allOf:
        - $ref: '#/components/schemas/VenueBlockInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            venueId: { type: string, format: uuid }
            createdById: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    Window:
      type: object
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Availability:
      type: object
      properties:
        venueId: { type: string, format: uuid }
        timeZone: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        windows: { type: array, items: { $ref: '#/components/schemas/Window' } }
        blocks: { type: array, items: { $ref: '#/components/schemas/VenueBlock' } }
      example:
        venueId: c1000000-0000-4000-8000-000000000001
        timeZone: Asia/Singapore
        from: '2026-10-19T00:00:00+08:00'
        to: '2026-10-23T00:00:00+08:00'
        windows:
          - { startsAt: '2026-10-22T07:00:00+08:00', endsAt: '2026-10-22T23:00:00+08:00' }
        blocks: []
