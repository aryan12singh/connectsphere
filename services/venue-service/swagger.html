  "info":{"title":"ConnectSphere Venue Service","version":"0.5.0","description":"Versioned Venue catalogue, opening hours, fixed setup/turnaround buffers and immutable Staff history. Venue reads require an internal role and venues.view; Venue Staff manage changes. Changes persist durable current-booking recheck intent. Deletion is serialized through Booking and fails closed on current occupied commitments or dependency failure."},

  "paths":{
    "/venues/{venueId}/buffer-status":{"parameters":[{"$ref":"#/components/parameters/VenueId"}],"get":{"summary":"Check current Staff buffer edit permission","description":"Returns venueId,version,canEdit. A provisional fence is editable only with current Booking proof of no historical confirmation and no legacy configuration receipt. UI permission is bound to the same Venue version; writes recheck under locks.","responses":{"200":{"description":"Current versioned result"},"403":{"description":"Venue Staff capability required"},"404":{"description":"Venue missing"},"409":{"description":"Stale venue, contacts or bookings; one-time configuration closed"},"422":{"description":"Invalid buffers, reason or incomplete communication attestation"},"503":{"description":"Current booking/Event proof unavailable; reload before retrying"}}}},"/venues/{venueId}/legacy-buffer-context":{"parameters":[{"$ref":"#/components/parameters/VenueId"}],"get":{"summary":"Read current communication checklist for initial legacy configuration","description":"Venue Staff only. Returns venueId,version,affectedEvents with eventId,title,coordinatorId,organiserId and bookings (id/version). Collects effective current/future Event holds and confirmed bookings under Booking venue lock. Active unlinked commitments or missing contacts fail closed.","responses":{"200":{"description":"Current versioned result"},"403":{"description":"Venue Staff capability required"},"404":{"description":"Venue missing"},"409":{"description":"Stale venue, contacts or bookings; one-time configuration closed"},"422":{"description":"Invalid buffers, reason or incomplete communication attestation"},"503":{"description":"Current booking/Event proof unavailable; reload before retrying"}}}},"/venues/{venueId}/legacy-buffers":{"parameters":[{"$ref":"#/components/parameters/VenueId"}],"put":{"summary":"Configure legacy buffers once after recorded communication","description":"Venue Staff only. Mandatory current version, setupMinutes,turnaroundMinutes,reason and communications for every current affected Event. Each record carries eventId,coordinatorId,organiserId,bookings(id/version), staffInformedCoordinator=true,coordinatorInformedOrganiser=true,note (1–1000 chars). Empty array permitted only when the authoritative current affected set is empty. This is Staff attestation, not proof of external delivery. Booking venue lock and Venue row CAS serialize with commitments; atomic history/recheck/allowance consumption retain approvals. Lost acknowledgement must be reconciled by rereading; no second configuration.","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["version","setupMinutes","turnaroundMinutes","reason","communications"],"properties":{"version":{"type":"integer","minimum":1},"setupMinutes":{"type":"integer","minimum":0,"description":"Configured maximum from /venues/options"},"turnaroundMinutes":{"type":"integer","minimum":0},"reason":{"type":"string","minLength":1,"maxLength":1000},"communications":{"type":"array","items":{"type":"object","required":["eventId","coordinatorId","organiserId","bookings","staffInformedCoordinator","coordinatorInformedOrganiser","note"],"properties":{"eventId":{"type":"string"},"coordinatorId":{"type":"string"},"organiserId":{"type":"string"},"bookings":{"type":"array","items":{"type":"object","required":["id","version"],"properties":{"id":{"type":"string"},"version":{"type":"integer","minimum":1}}}},"staffInformedCoordinator":{"const":true},"coordinatorInformedOrganiser":{"const":true},"note":{"type":"string","minLength":1,"maxLength":1000}}}}}}}}},"responses":{"200":{"description":"Current versioned result"},"403":{"description":"Venue Staff capability required"},"404":{"description":"Venue missing"},"409":{"description":"Stale venue, contacts or bookings; one-time configuration closed"},"422":{"description":"Invalid buffers, reason or incomplete communication attestation"},"503":{"description":"Current booking/Event proof unavailable; reload before retrying"}}}},"/internal/venues/{venueId}/legacy-buffers":{"parameters":[{"$ref":"#/components/parameters/VenueId"}],"put":{"summary":"Private commit of Booking-verified legacy configuration","security":[{"internalApiKey":[]}],"description":"Only called while Booking holds the venue commitment lock. Validated actor/communications, mandatory version CAS; atomic one-use receipt/history/recheck. Not routed by Kong.","responses":{"200":{"description":"Current versioned result"},"403":{"description":"Venue Staff capability required"},"404":{"description":"Venue missing"},"409":{"description":"Stale venue, contacts or bookings; one-time configuration closed"},"422":{"description":"Invalid buffers, reason or incomplete communication attestation"},"503":{"description":"Current booking/Event proof unavailable; reload before retrying"}}}},"/internal/venues/{venueId}/buffer-fence-recovery":{"parameters":[{"$ref":"#/components/parameters/VenueId"}],"put":{"summary":"Private edit after never-confirmed Booking proof","security":[{"internalApiKey":[]}],"description":"Booking venue lock must remain held. Requires full validated Venue input/current version and actor; only a recorded provisional lock with no legacy configuration receipt can be cleared. No blanket unlock API. Not routed by Kong.","responses":{"200":{"description":"Current versioned result"},"403":{"description":"Venue Staff capability required"},"404":{"description":"Venue missing"},"409":{"description":"Stale venue, contacts or bookings; one-time configuration closed"},"422":{"description":"Invalid buffers, reason or incomplete communication attestation"},"503":{"description":"Current booking/Event proof unavailable; reload before retrying"}}}},
    "/internal/venues/{venueId}/buffer-lock":{"parameters":[{"$ref":"#/components/parameters/VenueId"}],"post":{"summary":"Establish the monotonic venue buffer fence","security":[{"internalApiKey":[]}],"description":"Internal only, not routed by Kong. Booking calls this before committing CONFIRMED. Venue row lock and mandatory version CAS serialize with buffer edits. Increments version and records immutable actor history only on first lock. Uncertain failed confirmation never automatically unlocks.","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["version","actor"],"properties":{"version":{"type":"integer","minimum":1},"actor":{"type":"object","required":["id","role"],"properties":{"id":{"type":"string"},"role":{"type":"string"}}}}}}}},"responses":{"200":{"description":"Current locked Venue including buffersLockedAt and post-lock version"},"403":{"description":"Invalid internal credential"},"404":{"description":"Venue missing"},"409":{"description":"Stale Venue version"},"422":{"description":"Invalid version or actor"}}}},

    "/venues/{venueId}/internal":{"get":{"summary":"Private current venue, buffers and hours","security":[{"internalApiKey":[]}],"description":"Service-to-service internal key required; no public caller grant. Private deletion namespace is not exposed by Kong.","responses":{"200":{"description":"Current catalogue projection or deleted Venue"},"403":{"description":"Invalid internal credential"},"404":{"description":"Venue not found"}}},"parameters":[{"$ref":"#/components/parameters/VenueId"}]},

ue,"description":"Server-owned one-time pre-policy catalogue allowance; never writable through normal CRUD"},"buffersLockedAt":{"type":["string","null"],"format":"date-time","readOnly":true,"description":"Concurrency fence ahead of first successful confirmation. A failed confirmation may be recovered only after authoritative never-confirmed proof under Booking lock; legacy configuration uses its separate one-time allowance."}}},"VenueInput":{"type":"object","required":["name","venueType","supportedLayouts","facilities","accessibilityTags","timeZone","managedById","reason","operatingHours"],"properties":{"name":{"type":"string"},"address":{"type":"string","nullable":true},"capacity":{"type":"integer","minimum":1,"maximum":10000,"nullable":true},"venueType":{"type":"string","enum":["PHYSICAL","VIRTUAL","HYBRID"]},"supportedLayouts":{"type":"array","items":{"type":"string","enum":["THEATRE","CLASSROOM","CABARET"]}},"facilities":{"type":"array","items":{"type":"string"}},"accessibilityTags":{"type":"array","items":{"type":"string"}},"timeZone":{"type":"string"},"isActive":{"type":"boolean"},"managedById":{"type":"string"},"reason":{"type":"string"},"operatingHours":{"type":"array","minItems":1,"items":{"$ref":"#/components/schemas/OperatingHour"}},"setupMinutes":{"type":"integer","minimum":0,"default":0,"description":"Whole minutes; configured cap returned by /venues/options"},"turnaroundMinutes":{"type":"integer","minimum":0,"default":0,"description":"Whole minutes; configured cap returned by /venues/options"},"version":{"type":"integer","minimum":1,"description":"Response version; supplied edit version must still match. Omission retained for existing API clients."}}},"OperatingHour":{"type":"object","required":["weekday","isClosed"],"properties":{"weekday":{"type":"string","enum":["MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY","SUNDAY"]},"opensAt":{"type":"string","pattern":"^([01]\\d|2[0-3]):[0-5]\\d$"},"closesAt":{"type":"string","pattern":"^([01]\\d|
