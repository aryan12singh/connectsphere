      description: Organiser only. Default saveAs=draft; submit invokes full validator and shared
        transaction/assignment. Body organiserId/roles/status never controls identity. Requires
        trusted event_requests.create in addition to the documented role/relationship; caller grants
        are ignored.
      responses:
        "201":
          description: Successful committed result or authorised replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "400":
          description: Malformed query/body or missing operation key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired/revoked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong role/relationship; no data returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Record does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Stale version, invalid state, unchanged resubmit or conflicting key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: JSON body exceeds 10 KB; PAYLOAD_TOO_LARGE without echoing input.
        "422":
          description: Aggregated validation failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Required dependency unavailable; no partial write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
          description: Durable actor/method/path-scoped intent key. Retry identical JSON/version/key. Changed
            payload409. Replay reauthorises and returns original response; no TTL purge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      x-required-permissions:
        - event_requests.create
