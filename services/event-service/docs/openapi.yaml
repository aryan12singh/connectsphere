  /internal/events/{eventId}/cancellation-finalize:
    parameters: [{name: eventId, in: path, required: true, schema: {type: string}}]
    post:
      summary: Finalize a Cancelling Event once every release succeeded (CS-54, orchestrator only)
      security:
      - internalApiKey: []
      description: Body cancellationActionId and receipts. Requires a receipt for each of VENUE and EQUIPMENT (registration closes by reading the Event status) carrying the same action id and accepted event version, otherwise 409 RELEASES_INCOMPLETE. Writes Cancelled and one EventCancelled outbox row; a replay returns the same result. No public routing.
      responses:
        "200":
          description: Event is Cancelled
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Caller may not do this
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not allowed in the current state, stale or conflicting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

