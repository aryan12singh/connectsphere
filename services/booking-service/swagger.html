  <nav><a href="../event-service/swagger.html">Event service</a><a href="../venue-service/swagger.html">Venue service</a><strong>Booking service</strong></nav>
  <div id="swagger-ui"></div>
  <script id="openapi-spec" type="application/json">{
  "openapi":"3.1.0",
  "info":{"title":"ConnectSphere Booking Service","version":"0.6.0","description":"Independent venue arrangements. Current assigned Coordinators request/edit/release Planning Event rooms; Venue Staff make versioned active-hold decisions/extensions and operational closures. Server guards use current buffers, suitability, occupied hours and exact deadlines. Venue readiness is separate from whole-Event, technical and Safety readiness. Team policy: 72-hour holds, one requested Staff-approved extension of up to 24 hours, capped at setup; per-session attendance allocation readiness. Questions 1–2 remain pending."},
  "servers":[{"url":"/"}],
  "security":[{"bearerAuth":[]}],
  "paths":{
    "/venue-bookings/events/{eventId}/primary-venue":{"parameters":[{"name":"eventId","in":"path","required":true,"schema":{"type":"string"}}],"put":{"summary":"Select the primary attendee location","description":"Current assigned Coordinator in Planning only. Rechecks active hold deadline, current suitability and conflicts. Event and Venue locks serialize selection. Selection and immutable history commit atomically; room approvals and versions are unchanged. This does not publish the location.","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["bookingId","bookingVersion","version"],"properties":{"bookingId":{"type":"string"},"bookingVersion":{"type":"integer","minimum":1},"version":{"type":"integer","minimum":0,"description":"Current primary-selection version; zero when not selected"}}}}}},"responses":{"200":{"description":"Stored selection: eventId, bookingId, version, actorId, updatedAt"},"403":{"description":"Not the current authorized Coordinator"},"404":{"description":"Booking not in this Event"},"409":{"description":"Stale selection/booking, expired hold or unsuitable room"},"422":{"description":"Invalid input"},"503":{"description":"Authoritative dependency unavailable"}}}},
    "/venue-bookings":{"get":{"summary":"List bookings","parameters":[{"name":"venueId","in":"query","schema":{"type":"string"}},{"name":"eventId","in":"query","schema":{"type":"string"}},{"name":"status","in":"query","schema":{"type":"string"}}],"responses":{"200":{"description":"Current-assignment-scoped bookings; Staff pending queue includes current needs/windows, omits expired holds and preserves non-actionable missing-Event legacy rows"},"503":{"description":"Unable to validate current assignment; no writes/history changes"}},"description":" Coordinator calls require their current Event assignment; foreign/revoked assignment denies403 and dependency outage returns503. Lists/history omit unassigned work."},"post":{"summary":"Create a booking","description":"Requires Idempotency-Key. Ordinary callers require create permission and the current Coordinator assignment of the actual Planning Event ID. Requests create independent tentative holds with a persisted default deadline capped at setup; supplied deadlines must satisfy policy. Direct CONFIRMED creation is forbidden even with combined Coordinator/Staff roles. Venue Staff may create BLOCKED/UNAVAILABLE operational windows. Server rechecks suitability and conflicts atomically; no override. Replay returns the current original resource without another activity/intent.","parameters":[{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BookingInput"}}}},"responses":{"201":{"description":"Created","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Booking"}}}},"200":{"description":"Idempotent retry returns the original booking"},"403":{"description":"Requested status is not permitted for the actor"},"409":{"description":"Occupied-window conflict or idempotency key reused with different payload; no effects"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Unable to validate current assignment; no writes/history changes"}}}},
    "/venue-bookings/{bookingId}":{"parameters":[{"$ref":"#/components/parameters/BookingId"}],"get":{"summary":"Read a currently assigned Event booking or authorized Staff booking","responses":{"200":{"description":"Booking"},"403":{"description":"Current Event assignment or Staff access denied"},"503":{"description":"Unable to validate current assignment; no writes/history changes"}},"description":" Coordinator calls require their current Event assignment; foreign/revoked assignment denies403 and dependency outage returns503. Lists/history omit unassigned work."},"put":{"summary":"Replace a booking","description":"Current assigned Coordinator may change/release an unapproved room with its read version. A successful room/time move releases only the old hold; failure preserves siblings. Staff may edit/release operational windows. Confirmed/rejected decisions delegate to the guarded active-hold decision rules, never unrestricted status changes. Every mutation requires a reason.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BookingReplacementInput"}}}},"responses":{"200":{"description":"Updated booking"},"403":{"description":"Forbidden transition"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Unable to validate current assignment; no writes/history changes"},"409":{"description":"Stale version, expired hold, changed requirements or occupied-window conflict; no effects"}}},"delete":{"summary":"Reject deletion of an existing retained commitment","description":"After authentication/current access checks, existing booking and history are immutable to deletion. Use the authorized arrangement-change workflow.","responses":{"405":{"description":"METHOD_NOT_ALLOWED; Allow GET, PUT; no mutation"},"403":{"description":"Current access denied"},"404":{"description":"Booking not found"}}}},
    "/venue-bookings/history":{"get":{"summary":"List booking activity for a venue","parameters":[{"name":"venueId","in":"query","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Booking history; BFF merges with venue history"},"503":{"description":"Unable to validate current assignment; no writes/history changes"}},"description":"Immutable before/after venue membership: creation remains at its origin; moves appear in both involved timelines. Snapshotless imported activity is anchored to the earliest known snapshot, falling back to current venue only when none exists. Current-assignment booking access still applies."}},
    "/venue-bookings/availability":{"get":{"summary":"Read current occupied intervals and deadline-aware availability","parameters":[{"name":"venueId","in":"query","schema":{"type":"string"}},{"name":"startAt","in":"query","required":false,"schema":{"type":"string","format":"date-time"}},{"name":"endAt","in":"query","required":false,"schema":{"type":"string","format":"date-time"}}],"responses":{"200":{"description":"items, checkedAt, conflictDetection=server and policy.allowTouching. Current Venue buffers; ineffective holds omitted. Unrelated Event titles/reasons/links/flags are redacted; operational closure titles remain visible."},"503":{"description":"Current Venue/assignment dependency unavailable"}},"description":"venues.view and an internal role (Coordinator, Venue Staff or Technical Support) required. Read-only intervals; no write grant implied."}},
    "/internal/venue-links/{venueId}":{"parameters":[{"name":"venueId","in":"path","required":true,"schema":{"type":"string"}}],"get":{"summary":"Count blocking bookings for a venue","description":"Private read-only count of effective current/future tentative/confirmed occupied commitments. Expired holds are ignored. Venue deletion instead uses the serialized removal protocol.","security":[{"internalApiKey":[]}],"parameters":[{"name":"blockingOnly","in":"query","schema":{"type":"boolean","default":true}}],"responses":{"200":{"description":"Blocking booking count"},"403":{"description":"Missing internal service credential"}}}},
    "/venue-bookings/{bookingId}/decision":{"parameters":[{"$ref":"#/components/parameters/BookingId"}],"put":{"summary":"Approve or reject one active room hold","description":"Venue Staff with venue_bookings.decide; current version and non-empty reason required. Decision affects only this booking. Approval rechecks current suitability and conflicts and clears its valid hold; rejection releases it. Extension requires the current Coordinator request for this exact deadline, an unused allowance and at most 24 added hours within the setup cap. Stale/expired attempts produce no activity/intent. Before confirmation a versioned Venue-owned buffer fence must succeed. Lost acknowledgement fails closed without confirming; retry after refresh. No automatic unlock.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BookingDecision"}}}},"responses":{"200":{"description":"Updated booking"},"403":{"description":"Required action role, permission or current assignment denied"},"409":{"description":"Stale version, expired hold, changed requirements or occupied-window conflict; no effects"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Required service unavailable; no business write"}}}},
    "/venue-bookings/{bookingId}/hold-extension/request":{"parameters":[{"$ref":"#/components/parameters/BookingId"}],"post":{"summary":"Request one hold extension as the currently assigned Coordinator","description":"Planning only; current version, future deadline and reason required. At most 24 added hours capped at setup. Does not change hold expiry; request is cleared on arrangement edits or approval.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/HoldExtension"}}}},"responses":{"200":{"description":"Booking with persisted extensionRequest"},"403":{"description":"Not the permitted current Coordinator"},"409":{"description":"Stale, expired or already extended hold"},"422":{"$ref":"#/components/responses/ValidationError"}}}},
    "/venue-bookings/{bookingId}/hold-extension":{"parameters":[{"$ref":"#/components/parameters/BookingId"}],"put":{"summary":"Approve the current Coordinator extension request once","description":"Venue Staff with venue_bookings.decide; current version and non-empty reason required. Decision affects only this booking. Approval rechecks current suitability and conflicts and clears its valid hold; rejection releases it. Extension requires the current Coordinator request for this exact deadline, an unused allowance and at most 24 added hours within the setup cap. Stale/expired attempts produce no activity/intent.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/HoldExtension"}}}},"responses":{"200":{"description":"Updated booking"},"403":{"description":"Required action role, permission or current assignment denied"},"409":{"description":"Stale version, expired hold, changed requirements or occupied-window conflict; no effects"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Required service unavailable; no business write"}}}},
    "/venue-bookings/events/{eventId}/summary":{"parameters":[{"name":"eventId","in":"path","required":true,"schema":{"type":"string"}}],"get":{"summary":"Read independent room arrangements and current venue readiness","description":"Current assigned Coordinator or authorized Venue Staff only. Current Event assignment/needs and Venue suitability are checked. Expired, rejected, pending or flagged required non-cancelled rooms remain outstanding. Does not confirm the Event or prove technical/Safety approval. Includes primaryVenue with bookingId, independent selection version and derived available flag. Missing selection is bookingId:null/version:0. Unavailable choices are retained without automatic fallback.","responses":{"200":{"description":"event, items, venueReady, outstanding, checkedAt and provisional policy; items include authoritative current venueType and venueCapacity (removed venue type is null), independent of stored requirements"},"403":{"description":"Required action role, permission or current assignment denied"},"409":{"description":"Stale version, expired hold, changed requirements or occupied-window conflict; no effects"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Required service unavailable; no business write"}}}},
    "/venue-bookings/events/{eventId}/venue-search":{"parameters":[{"name":"eventId","in":"path","required":true,"schema":{"type":"string"}}],"get":{"summary":"Search suitable available rooms for one Planning Event","description":"Current assigned Coordinator with create permission. Default time/attendance/layout/accessibility from Event; explicit room needs are independent. Lists full matches first then eligible partials with named gaps; capacity/type/inactive/occupied-hours/conflict guards exclude candidates. Comma-separated facility/accessibility codes. Creates no reservation; request/approval recheck. Booking-specific alternatives preserve current Event accessibility needs and never create, release or replace a commitment. Unapproved moves use the existing guarded PUT; approved-original replacement lifecycle remains separate CS-92 scope.","parameters":[{"name":"startAt","in":"query","required":false,"schema":{"type":"string"}},{"name":"endAt","in":"query","required":false,"schema":{"type":"string"}},{"name":"layout","in":"query","required":false,"schema":{"type":"string"}},{"name":"facilities","in":"query","required":false,"schema":{"type":"string"}},{"name":"accessibilityNeeds","in":"query","required":false,"schema":{"type":"string"}},{"name":"location","in":"query","required":false,"schema":{"type":"string"}},{"name":"expectedAttendance","in":"query","required":false,"schema":{"type":"integer","minimum":1}},{"name":"bookingId","in":"query","schema":{"type":"string"},"description":"Optional source booking of this Event; uses its room needs as defaults and excludes its original venue"},{"name":"bookingVersion","in":"query","schema":{"type":"integer","minimum":1},"description":"Required current read version when bookingId is present"}],"responses":{"200":{"description":"criteria, items, total and checkedAt; each candidate has match, gaps, canRequest and occupied timing"},"403":{"description":"Required action role, permission or current assignment denied"},"409":{"description":"Stale version, expired hold, changed requirements or occupied-window conflict; no effects"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Required service unavailable; no business write"}}}},
    "/internal/venue-rechecks":{"post":{"summary":"Apply a versioned current Venue configuration recheck","security":[{"internalApiKey":[]}],"description":"Private service boundary, not routed by Kong. Requires a verified actor and internal key. Recheck retains inherited commitments and records only actual timing/flag changes; retries are idempotent. Removal holds the shared Venue commit lock while checking and calling private Venue deletion.","responses":{"200":{"description":"Versioned acknowledgement or serialized deletion result"},"403":{"description":"Required action role, permission or current assignment denied"},"409":{"description":"Stale version, expired hold, changed requirements or occupied-window conflict; no effects"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Required service unavailable; no business write"}}}},
    "/internal/venue-removals/{venueId}":{"post":{"summary":"Serialize unused-Venue deletion with booking commitments","security":[{"internalApiKey":[]}],"description":"Internal only. Retains the booking venue lock, checks current occupied windows, and supplies the checked Venue version to a row-locked private delete. Concurrent configuration change returns409 for refresh/retry; no false deletion acknowledgement.","responses":{"200":{"description":"Versioned acknowledgement or serialized deletion result"},"403":{"description":"Required action role, permission or current assignment denied"},"409":{"description":"Stale version, expired hold, changed requirements or occupied-window conflict; no effects"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Required service unavailable; no business write"}}},"parameters":[{"name":"venueId","in":"path","required":true,"schema":{"type":"string"}}]},
    "/venue-bookings/conflicts":{"get":{"summary":"Staff review current inherited conflicts and suitability flags","description":"Venue Staff only. Read-only projection of current occupied setup/event/turnaround windows, flags and current assignment, including inherited approved commitments whose advertised event has ended but turnaround remains occupied. Missing legacy Events are flagged without inventing recipients. Does not cancel, approve, delete or deliver notices.","parameters":[{"name":"venueId","in":"query","schema":{"type":"string"}}],"responses":{"200":{"description":"items with current flags/conflicts; venues with current configuration version; checkedAt"},"403":{"description":"Required action role/capability denied"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Current Venue/Event dependency unavailable"}}}},
    "/venue-bookings/rechecks":{"post":{"summary":"Recheck existing commitments after buffer rollout","description":"Authenticated Venue Staff; current venue version and reason required. Rechecks future effective commitments under the venue lock after current-context reads. Retains status/history and atomically writes changed flags, audited actor/reason and durable intent. Same-state retries produce no duplicate activity. This is not a hold expiry worker or notification relay.","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["venueId","version","reason"],"properties":{"venueId":{"type":"string","minLength":1},"version":{"type":"integer","minimum":1},"reason":{"type":"string","minLength":1}}}}}},"responses":{"200":{"description":"venueId, current version and changed booking IDs"},"403":{"description":"Required action role/capability denied"},"409":{"description":"Stale venue configuration; refresh and retry"},"422":{"$ref":"#/components/responses/ValidationError"},"503":{"description":"Required dependency unavailable; no partial recheck"}}}}
  },
  "components":{"securitySchemes":{"bearerAuth":{"type":"http","scheme":"bearer"},"internalApiKey":{"type":"apiKey","in":"header","name":"x-internal-api-key"}},"parameters":{"BookingId":{"name":"bookingId","in":"path","required":true,"schema":{"type":"string"}},"IdempotencyKey":{"name":"Idempotency-Key","in":"header","required":true,"schema":{"type":"string"}}},"responses":{"ValidationError":{"description":"Field-level validation","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ValidationError"}}}}},"schemas":{"Booking":{"type":"object","required":["id","venueId","requestedById","title","reason","startAt","endAt","timeZone","status"],"properties":{"id":{"type":"string"},"eventId":{"type":"string","nullable":true},"venueId":{"type":"string"},"requestedById":{"type":"string"},"title":{"type":"string"},"reason":{"type":"string"},"startAt":{"type":"string","format":"date-time"},"endAt":{"type":"string","format":"date-time"},"timeZone":{"type":"string"},"status":{"type":"string","enum":["AVAILABLE","TENTATIVELY_HELD","CONFIRMED","BLOCKED","UNAVAILABLE","REJECTED","CANCELLED"]},"statusChangedById":{"type":"string","nullable":true},"statusChangedRole":{"type":"string","enum":["EVENT_ORGANISER","EVENT_COORDINATOR","VENUE_STAFF","ATTENDEE","TECHNICAL_SUPPORT_STAFF"],"nullable":true},"statusChangedAt":{"type":"string","format":"date-time","nullable":true},"version":{"type":"integer","minimum":1},"extensionCount":{"type":"integer","readOnly":true,"minimum":0,"maximum":1},"extensionRequest":{"type":["object","null"],"readOnly":true},"expiresAt":{"type":["string","null"],"format":"date-time"},"expectedAttendance":{"type":["integer","null"],"minimum":1},"layout":{"type":["string","null"]},"facilities":{"type":"array","items":{"type":"string"}},"accessibilityNeeds":{"type":"array","items":{"type":"string"}},"required":{"type":"boolean","const":true},"setupMinutes":{"type":"integer","minimum":0},"turnaroundMinutes":{"type":"integer","minimum":0},"occupiedStart":{"type":"string","format":"date-time"},"occupiedEnd":{"type":"string","format":"date-time"},"venueVersion":{"type":"integer","minimum":0},"flags":{"type":"array","items":{"type":"string"}}}},"BookingInput":{"type":"object","required":["venueId","title","reason","startAt","endAt","timeZone"],"properties":{"eventId":{"type":"string"},"venueId":{"type":"string"},"title":{"type":"string"},"reason":{"type":"string"},"startAt":{"type":"string","format":"date-time"},"endAt":{"type":"string","format":"date-time"},"timeZone":{"type":"string"},"status":{"type":"string","enum":["TENTATIVELY_HELD","CANCELLED","BLOCKED","UNAVAILABLE"]},"expiresAt":{"type":["string","null"],"format":"date-time"},"expectedAttendance":{"type":["integer","null"],"minimum":1},"layout":{"type":["string","null"]},"facilities":{"type":"array","items":{"type":"string"}},"accessibilityNeeds":{"type":"array","items":{"type":"string"}},"required":{"type":"boolean","const":true}}},"ValidationError":{"type":"object","required":["error"],"properties":{"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"fields":{"type":"object","additionalProperties":{"type":"array","items":{"type":"string"}}}}}}},"BookingReplacementInput":{"type":"object","required":["venueId","title","reason","startAt","endAt","timeZone","version"],"properties":{"eventId":{"type":"string"},"venueId":{"type":"string"},"title":{"type":"string"},"reason":{"type":"string"},"startAt":{"type":"string","format":"date-time"},"endAt":{"type":"string","format":"date-time"},"timeZone":{"type":"string"},"status":{"type":"string","enum":["AVAILABLE","TENTATIVELY_HELD","CONFIRMED","BLOCKED","UNAVAILABLE","REJECTED","CANCELLED"]},"expiresAt":{"type":["string","null"],"format":"date-time"},"expectedAttendance":{"type":["integer","null"],"minimum":1},"layout":{"type":["string","null"]},"facilities":{"type":"array","items":{"type":"string"}},"accessibilityNeeds":{"type":"array","items":{"type":"string"}},"required":{"type":"boolean","const":true},"version":{"type":"integer","minimum":1}}},"BookingDecision":{"type":"object","required":["version","status","reason"],"properties":{"version":{"type":"integer","minimum":1},"status":{"type":"string","enum":["CONFIRMED","REJECTED"]},"reason":{"type":"string","minLength":1}}},"HoldExtension":{"type":"object","required":["version","expiresAt","reason"],"properties":{"version":{"type":"integer","minimum":1},"expiresAt":{"type":"string","format":"date-time"},"reason":{"type":"string","minLength":1}}}}}
}</script>
